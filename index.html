<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSLE Chinese AL1 Mastery</title>
    <style>
    :root { 
        /* Primary: Deep academic teal/blue instead of red */
        --p: #2563eb; 
        /* Secondary: Dark slate for text */
        --s: #1e293b; 
        /* Background: Very light cool gray */
        --bg: #f8fafc; 
        --white: #ffffff; 
        /* Feedback colors - now much more distinct */
        --correct-bg: #dcfce7;
        --correct-text: #166534;
        --correct-border: #22c55e;
        --wrong-bg: #fee2e2;
        --wrong-text: #991b1b;
        --wrong-border: #ef4444;
    }

    body { 
        font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif; 
        background-color: var(--bg); 
        margin: 0; 
        padding: 10px; 
        display: flex; 
        justify-content: center; 
        color: var(--s);
    }

    .quiz-card { 
        width: 100%; 
        max-width: 500px; 
        background: var(--white); 
        padding: 24px; 
        border-radius: 20px; 
        box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
        /* Top accent bar is now Blue */
        border-top: 6px solid var(--p); 
    }

    .header { text-align: center; margin-bottom: 24px; }
    
    .prog-bg { height: 8px; background: #e2e8f0; border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
    .prog-fill { height: 100%; background: var(--p); width: 0%; transition: width 0.4s ease; }

    .cat-tag { 
        font-size: 0.75rem; 
        font-weight: bold; 
        color: var(--p); 
        background: #eff6ff;
        border: 1px solid #bfdbfe; 
        padding: 4px 10px; 
        border-radius: 6px; 
        text-transform: uppercase;
    }

    .q-text { 
        font-size: 1.25rem; 
        font-weight: 600; 
        margin: 20px 0; 
        line-height: 1.6; 
        color: var(--s); 
    }

    .opt-grid { display: flex; flex-direction: column; gap: 12px; }

    .opt-btn { 
        padding: 16px; 
        border: 2px solid #e2e8f0; 
        border-radius: 12px; 
        background: #fff; 
        text-align: left; 
        cursor: pointer; 
        font-size: 1.05rem; 
        transition: all 0.2s; 
        color: var(--s);
    }

    /* Selection state is now a soft blue */
    .opt-btn.selected { 
        border-color: var(--p); 
        background: #eff6ff; 
        color: var(--p); 
        font-weight: bold; 
        transform: translateX(5px);
    }

    .opt-btn:hover { border-color: #cbd5e0; }

    /* Feedback boxes - Red and Green are now the only bright colors */
    .feedback { 
        margin-top: 20px; 
        padding: 16px; 
        border-radius: 12px; 
        display: none; 
        line-height: 1.6; 
        font-size: 0.95rem; 
        border-width: 1px;
        border-style: solid;
    }

    .feedback.correct { 
        display: block; 
        background: var(--correct-bg); 
        color: var(--correct-text); 
        border-color: var(--correct-border); 
    }

    .feedback.wrong { 
        display: block; 
        background: var(--wrong-bg); 
        color: var(--wrong-text); 
        border-color: var(--wrong-border); 
    }

    button.main-btn { 
        width: 100%; 
        padding: 18px; 
        border-radius: 12px; 
        border: none; 
        font-weight: bold; 
        font-size: 1.1rem; 
        cursor: pointer; 
        margin-top: 24px; 
        transition: transform 0.1s, opacity 0.2s;
    }

    button.main-btn:active { transform: scale(0.98); }

    .confirm { background: var(--s); color: white; }
    .confirm:disabled { opacity: 0.2; cursor: not-allowed; }

    .next { background: var(--p); color: white; display: none; }

    #final-score { color: var(--p); font-weight: 900; }
</style>
</head>
<body>

<div class="quiz-card">
    <div id="quiz-ui">
        <div class="header">
            <h2 style="margin:0; color:var(--p)">小六华文：冲刺AL1</h2>
            <p id="q-counter" style="color:#666; font-size:0.9rem;">Bitesize 10 Qns</p>
        </div>
        <div class="prog-bg"><div class="prog-fill" id="prog-bar"></div></div>

        <div id="question-area">
            <span class="cat-tag" id="q-cat"></span>
            <div class="q-text" id="q-text"></div>
            <div class="opt-grid" id="opt-grid"></div>
            <div id="feedback" class="feedback"></div>
            <div class="btn-group">
                <button id="btn-confirm" class="main-btn confirm" disabled onclick="confirmAnswer()">确定 (Confirm)</button>
                <button id="btn-next" class="main-btn next" onclick="nextQuestion()">下一题 (Next)</button>
            </div>
        </div>
    </div>

    <div id="result-ui" style="display:none; text-align:center;">
        <h2 style="color:var(--p)">练习结束！</h2>
        <h1 id="final-score" style="font-size:3.5rem;">0/10</h1>
        <button class="main-btn confirm" onclick="generateNewSet()">再挑战 10 题</button>
    </div>
</div>

    let currentSet = [];
    let currentIdx = 0;
    let score = 0;
    let selectedIdx = null;

    function generateNewSet() {
        score = 0;
        currentIdx = 0;
        // Shuffle and slice 10 (though we only have 10 now, this is expandable)
        currentSet = [...fullBank].sort(() => 0.5 - Math.random()).slice(0, 10);
        document.getElementById('result-ui').style.display = 'none';
        document.getElementById('quiz-ui').style.display = 'block';
        showQuestion();
    }

    function showQuestion() {
        const q = currentSet[currentIdx];
        document.getElementById('q-counter').innerText = `第 ${currentIdx + 1} 题 / 共 10 题`;
        document.getElementById('prog-bar').style.width = `${(currentIdx / 10) * 100}%`;
        document.getElementById('q-cat').innerText = q.category;
        document.getElementById('q-text').innerText = q.question;
        
        const grid = document.getElementById('opt-grid');
        grid.innerHTML = '';
        selectedIdx = null;
        
        document.getElementById('feedback').style.display = 'none';
        document.getElementById('btn-confirm').style.display = 'block';
        document.getElementById('btn-confirm').disabled = true;
        document.getElementById('btn-next').style.display = 'none';

        q.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = `${i + 1}. ${opt}`;
            btn.onclick = () => {
                selectedIdx = i;
                document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                document.getElementById('btn-confirm').disabled = false;
            };
            grid.appendChild(btn);
        });
    }

    function confirmAnswer() {
        const q = currentSet[currentIdx];
        const isCorrect = selectedIdx === q.correctIdx;
        if(isCorrect) score++;

        const fb = document.getElementById('feedback');
        fb.className = `feedback ${isCorrect ? 'correct' : 'wrong'}`;
        fb.innerHTML = `<strong>${isCorrect ? '答对了！✓' : '答错了 ✗'}</strong><br>${q.explanation}`;
        fb.style.display = 'block';

        document.getElementById('btn-confirm').style.display = 'none';
        document.getElementById('btn-next').style.display = 'block';
        document.querySelectorAll('.opt-btn').forEach(b => b.style.pointerEvents = 'none');
    }

    function nextQuestion() {
        currentIdx++;
        if(currentIdx < 10) showQuestion();
        else {
            document.getElementById('quiz-ui').style.display = 'none';
            document.getElementById('result-ui').style.display = 'block';
            document.getElementById('final-score').innerText = `${score} / 10`;
        }
    }

    window.onload = generateNewSet;
</script>
