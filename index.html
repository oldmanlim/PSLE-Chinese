<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSLE Chinese AL1 Mastery</title>
    <style>
        :root { --p: #c0392b; --s: #2c3e50; --bg: #f9f4f0; --white: #ffffff; }
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); margin: 0; padding: 10px; display: flex; justify-content: center; }
        .quiz-card { width: 100%; max-width: 500px; background: var(--white); padding: 20px; border-radius: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); border-top: 5px solid var(--p); }
        .header { text-align: center; margin-bottom: 20px; }
        .prog-bg { height: 6px; background: #eee; border-radius: 3px; margin-bottom: 20px; }
        .prog-fill { height: 100%; background: var(--p); width: 0%; transition: 0.4s; }
        .cat-tag { font-size: 0.8rem; font-weight: bold; color: var(--p); border: 1px solid var(--p); padding: 2px 8px; border-radius: 5px; }
        .q-text { font-size: 1.2rem; font-weight: 600; margin: 20px 0; line-height: 1.6; color: var(--s); }
        .opt-grid { display: flex; flex-direction: column; gap: 10px; }
        .opt-btn { padding: 15px; border: 1px solid #ddd; border-radius: 10px; background: #fff; text-align: left; cursor: pointer; font-size: 1.1rem; transition: 0.2s; }
        .opt-btn.selected { border-color: var(--p); background: #fdf2f2; color: var(--p); font-weight: bold; }
        .feedback { margin-top: 15px; padding: 15px; border-radius: 10px; display: none; line-height: 1.5; font-size: 0.95rem; }
        .feedback.correct { display: block; background: #e9f7ef; color: #1e8449; border: 1px solid #2ecc71; }
        .feedback.wrong { display: block; background: #fdedec; color: #943126; border: 1px solid #e74c3c; }
        button.main-btn { width: 100%; padding: 16px; border-radius: 10px; border: none; font-weight: bold; font-size: 1.1rem; cursor: pointer; margin-top: 20px; }
        .confirm { background: var(--s); color: white; }
        .confirm:disabled { opacity: 0.3; }
        .next { background: var(--p); color: white; display: none; }
    </style>
</head>
<body>

<div class="quiz-card">
    <div id="quiz-ui">
        <div class="header">
            <h2 style="margin:0; color:var(--p)">小六华文：冲刺AL1</h2>
            <p id="q-counter" style="color:#666; font-size:0.9rem;">Bitesize 10 Qns</p>
        </div>
        <div class="prog-bg"><div class="prog-fill" id="prog-bar"></div></div>

        <div id="question-area">
            <span class="cat-tag" id="q-cat"></span>
            <div class="q-text" id="q-text"></div>
            <div class="opt-grid" id="opt-grid"></div>
            <div id="feedback" class="feedback"></div>
            <div class="btn-group">
                <button id="btn-confirm" class="main-btn confirm" disabled onclick="confirmAnswer()">确定 (Confirm)</button>
                <button id="btn-next" class="main-btn next" onclick="nextQuestion()">下一题 (Next)</button>
            </div>
        </div>
    </div>

    <div id="result-ui" style="display:none; text-align:center;">
        <h2 style="color:var(--p)">练习结束！</h2>
        <h1 id="final-score" style="font-size:3.5rem;">0/10</h1>
        <button class="main-btn confirm" onclick="generateNewSet()">再挑战 10 题</button>
    </div>
</div>

    let currentSet = [];
    let currentIdx = 0;
    let score = 0;
    let selectedIdx = null;

    function generateNewSet() {
        score = 0;
        currentIdx = 0;
        // Shuffle and slice 10 (though we only have 10 now, this is expandable)
        currentSet = [...fullBank].sort(() => 0.5 - Math.random()).slice(0, 10);
        document.getElementById('result-ui').style.display = 'none';
        document.getElementById('quiz-ui').style.display = 'block';
        showQuestion();
    }

    function showQuestion() {
        const q = currentSet[currentIdx];
        document.getElementById('q-counter').innerText = `第 ${currentIdx + 1} 题 / 共 10 题`;
        document.getElementById('prog-bar').style.width = `${(currentIdx / 10) * 100}%`;
        document.getElementById('q-cat').innerText = q.category;
        document.getElementById('q-text').innerText = q.question;
        
        const grid = document.getElementById('opt-grid');
        grid.innerHTML = '';
        selectedIdx = null;
        
        document.getElementById('feedback').style.display = 'none';
        document.getElementById('btn-confirm').style.display = 'block';
        document.getElementById('btn-confirm').disabled = true;
        document.getElementById('btn-next').style.display = 'none';

        q.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = `${i + 1}. ${opt}`;
            btn.onclick = () => {
                selectedIdx = i;
                document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                document.getElementById('btn-confirm').disabled = false;
            };
            grid.appendChild(btn);
        });
    }

    function confirmAnswer() {
        const q = currentSet[currentIdx];
        const isCorrect = selectedIdx === q.correctIdx;
        if(isCorrect) score++;

        const fb = document.getElementById('feedback');
        fb.className = `feedback ${isCorrect ? 'correct' : 'wrong'}`;
        fb.innerHTML = `<strong>${isCorrect ? '答对了！✓' : '答错了 ✗'}</strong><br>${q.explanation}`;
        fb.style.display = 'block';

        document.getElementById('btn-confirm').style.display = 'none';
        document.getElementById('btn-next').style.display = 'block';
        document.querySelectorAll('.opt-btn').forEach(b => b.style.pointerEvents = 'none');
    }

    function nextQuestion() {
        currentIdx++;
        if(currentIdx < 10) showQuestion();
        else {
            document.getElementById('quiz-ui').style.display = 'none';
            document.getElementById('result-ui').style.display = 'block';
            document.getElementById('final-score').innerText = `${score} / 10`;
        }
    }

    window.onload = generateNewSet;
